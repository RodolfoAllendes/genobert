# GenoBERT Pretraining Configuration — 24donor chr22 ALL
# Trained on chr22.phased_24donor_reference.vcf.gz (7,662 SNPs, 2559 train samples)

# ================== Data Parameters ==================
runId: 24donor_ALL_chr22_PT
dataset: 24donor
chromosome: 22
population: ALL
segLen: 258
overlap: 8

unique: True
hlaOnly: False

resDir: ./res
resPtDir: /tmp

# ================== Vocabulary ==================
vocabSize: 8
padId: 7
maskId: 0
CLSId: 5
SEPId: 6

# ================== Model Architecture ==================
embDim: 512
numHeads: 4
numLayers: 6
weightSharing: 0
dropoutRate: 0.0

enableBias: True
initBiasWeight: 0.0

useCNNBottleneck: True
bottleneckShape: 4
cnnKernelSize: 3

sparseAttention: False
localWinSize: 64
globalAttentionIds: [0]

# ================== Training Parameters ==================
batchSize: 128
numWorkers: 12
persistentWorkers: True
seed: 0

learningRate: 0.0008
weightDecay: 0.001

scheduler: cosineAnn
totalEpochs: 100
warmupEpochs: 10
cooldownEpochs: 0

maskProb: 0.5
sampling: normal
lossType: focalLoss
focalGamma: 2.0
benchmarkAll: True

useMixedPrecision: False

checkpointPrefix: ""
saveCheckpointFreq: 10

useWandB: False
wandbProject: GenoBERT
WandBKey: ""
